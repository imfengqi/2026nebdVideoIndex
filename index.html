<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>审稿</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      main {
        padding: 20px;
      }

      section {
        margin-bottom: 40px;
      }

      h2 {
        font-size: 24px;
        margin-bottom: 20px;
      }

      article {
        display: flex;
        flex-direction: column;
      }

      .videoBox {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .videoThumbnail {
        width: 300px;
        height: 200px;
        margin-right: 20px;
      }

      .videoThumbnail video {
        width: 100%;
        height: 100%;
      }

      .videoText {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>2026.10.25审稿</h1>
      <section>
        <h2>投稿成品（随机排序）</h2>

        <article>
          <div class="videoBox">
            <div class="videoThumbnail">
              <video controls preload="metadata">
                <source
                  src="https://2026neurobirthdaycn.org/upload/video/9%E6%9C%8829%E6%97%A5.mp4?inline=true#t=0.5"
                  type="video/mp4"
                />
              </video>
            </div>
            <div class="videoText">
              <h3>彼女は旅に出る（她踏上了旅途）</h3>
              <p>Complex</p>
              <p>通过，但仍需要修改。<b>可排在第二部分或第三部分</b></p>
            </div>
          </div>
          <div class="videoBox">
            <div class="videoThumbnail">
              <video controls preload="metadata">
                <source
                  src="https://2026neurobirthdaycn.org/upload/video/%E3%80%90tanoki%E3%80%91%E8%B7%B3%E8%88%9E%E7%89%9B%E8%82%89%E7%8C%AB.mp4?inline=true"
                  type="video/mp4"
                />
              </video>
            </div>
            <div class="videoText">
              <h3>跳舞牛肉猫</h3>
              <p>tanoki</p>
              <p>
                通过，但仍需要修改。目前修改方向有两个：</br>1.修改作为单独的互动节目</br>2.取前半部分动画作为主节目素材
              </p>
            </div>
          </div>
          <div class="videoBox">
            <div class="videoThumbnail">
              <video controls preload="metadata">
                <source
                  src="https://2026neurobirthdaycn.org/upload/video/%E6%88%91%E5%8F%88%E6%88%90%E4%BA%86.mp4?inline=true#t=0.5"
                  type="video/mp4"
                />
              </video>
            </div>
            <div class="videoText">
              <h3>MC超短动画-vedal的第一次落地水</h3>
              <p>划等号的非</p>
              <p><b>待观察</b>，建议加上更多和双子的互动情节</p>
            </div>
          </div>
          <div class="videoBox">
            <div class="videoThumbnail">
              <video controls preload="metadata">
                <source
                  src="https://2026neurobirthdaycn.org/upload/video/%E5%86%8D%E4%B9%9F%E4%B8%8D%E6%94%B9%E4%BA%86.mp4?inline=true#t=0.5"
                  type="video/mp4"
                />
              </video>
            </div>
            <div class="videoText">
              <h3>大未来电脑ÅMARA</h3>
              <p>意念艾特感叹号；帆意</p>
              <p>通过，<b>可排在第一或第三部分</b></p>
            </div>
          </div>
        </article>
      </section>

      <section>
        <h2>非成品（随机排序）</h2>

        <article>
          <div class="videoBox">
            <div class="videoThumbnail">
              <video controls preload="metadata">
                <source
                  src="https://2026neurobirthdaycn.org/upload/video/Video_1783881013924_723.mp4?inline=true#t=0.5"
                  type="video/mp4"
                />
              </video>
            </div>
            <div class="videoText">
              <h3>neuro的cheese</h3>
              <p>一直想睡觉的momo</p>
              <p>通过，但修改空间很大</p>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>

  <script src="script.js"></script>
</html>
